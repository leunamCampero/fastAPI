<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grenoble Safe Routes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --bg: #fff; --fg: #1f2937; --muted: #6b7280; --panel: #f8fafc; --border: #e5e7eb;
            --safe: #1d4ed8; --short: #e11d48; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --panel: #1f2937; --border: #374151; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg);
           display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
    aside { padding: 16px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--border); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.hint { color: var(--muted); margin: 0 0 14px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    select, input[type=range] { width: 100%; }
    select { padding: 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
    button { margin-top: 14px; width: 100%; padding: 8px; border: 0; border-radius: 6px;
             background: #374151; color: #fff; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    #msg { margin-top: 12px; color: var(--muted); }
    #map { height: 100vh; }
    a { color: inherit; }
    @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; }
                                #map { height: 60vh; } aside { border-right: 0; } }
  </style>
</head>
<body>
<aside>
  <h1>Grenoble safe-route planner</h1>
  <p class="hint">Click the map twice: start, then destination. Every number comes from the API
    (<a href="/docs">/docs</a>).</p>
  <label for="solution">Network</label>
  <select id="solution"></select>
  <label for="rho">rho (traffic avoidance): <span id="rhoVal">0.04</span></label>
  <input id="rho" type="range" min="0" max="0.3" step="0.01" value="0.04">
  <label><input id="showNet" type="checkbox" checked> show network coloured by DoS</label>
  <button id="reset">Reset points</button>
  <div id="msg">Waiting for the first click...</div>
  <table id="stats" hidden>
    <thead><tr><th>Route</th><th>km</th><th>km DoS 1-3</th><th>exposure</th></tr></thead>
    <tbody></tbody>
  </table>
</aside>
<div id="map"></div>
<script>
const DOS_COLORS = {6: "#1b7837", 5: "#5aae61", 4: "#7b8fc7", 3: "#fdae61", 2: "#f46d43", 1: "#b2182b"};
const map = L.map("map").setView([45.183, 5.724], 13);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: "&copy; OpenStreetMap contributors &copy; CARTO", maxZoom: 19 }).addTo(map);

const $ = (id) => document.getElementById(id);
let points = [], markers = [], routeLayers = [], netLayer = null;

async function api(path) {
  const r = await fetch(path);
  const body = await r.json();
  if (!r.ok) throw new Error(body.detail?.[0]?.msg || body.detail || r.statusText);
  return body;
}

async function loadSolutions() {
  for (const s of await api("/network/solutions")) {
    $("solution").add(new Option(s.label, s.solution));
  }
}

async function drawNetwork() {
  if (netLayer) { map.removeLayer(netLayer); netLayer = null; }
  if (!$("showNet").checked) return;
  const gj = await api(`/network/geojson?solution=${$("solution").value}`);
  netLayer = L.geoJSON(gj, { style: f => ({ color: DOS_COLORS[f.properties.dos], weight: 2, opacity: 0.55 }) }).addTo(map);
  routeLayers.forEach(l => l.bringToFront());
}

async function route() {
  routeLayers.forEach(l => map.removeLayer(l)); routeLayers = [];
  if (points.length < 2) return;
  const [a, b] = points;
  const q = `from_lat=${a.lat}&from_lon=${a.lng}&to_lat=${b.lat}&to_lon=${b.lng}` +
            `&solution=${$("solution").value}&rho=${$("rho").value}`;
  $("msg").textContent = "Routing...";
  try {
    const [safe, short] = await Promise.all([api(`/route?${q}&weight=cyclist`), api(`/route?${q}&weight=length`)]);
    const rows = [["Safest", safe, "var(--safe)", "#1d4ed8"], ["Shortest", short, "var(--short)", "#e11d48"]];
    for (const [, r, , color] of rows.slice().reverse()) {
      routeLayers.push(L.geoJSON(r.geometry, { style: { color, weight: 6, opacity: 0.9 } }).addTo(map));
    }
    $("stats").hidden = false;
    $("stats").querySelector("tbody").innerHTML = rows.map(([name, r, css]) =>
      `<tr><td><span class="dot" style="background:${css}"></span>${name}</td>
       <td>${r.stats.length_km.toFixed(2)}</td><td>${r.stats.km_exposed_dos_1_3.toFixed(2)}</td>
       <td>${r.stats.exposure_km_equiv.toFixed(3)}</td></tr>`).join("");
    const detour = (safe.stats.length_km / short.stats.length_km - 1) * 100;
    $("msg").textContent = `Safest route: ${detour >= 0 ? "+" : ""}${detour.toFixed(1)} % distance, ` +
      `${(short.stats.km_exposed_dos_1_3 - safe.stats.km_exposed_dos_1_3).toFixed(2)} km less next to traffic.`;
  } catch (e) { $("msg").textContent = "Error: " + e.message; }
}

map.on("click", (e) => {
  if (points.length === 2) reset();
  points.push(e.latlng);
  markers.push(L.circleMarker(e.latlng, { radius: 8, color: "#111", fillOpacity: 1 })
    .bindTooltip(points.length === 1 ? "start" : "end", { permanent: true }).addTo(map));
  $("msg").textContent = points.length === 1 ? "Now click the destination." : "";
  route();
});

function reset() {
  points = []; markers.forEach(m => map.removeLayer(m)); markers = [];
  routeLayers.forEach(l => map.removeLayer(l)); routeLayers = [];
  $("stats").hidden = true; $("msg").textContent = "Waiting for the first click...";
}
$("reset").onclick = reset;
$("rho").oninput = () => { $("rhoVal").textContent = $("rho").value; };
$("rho").onchange = route;
$("solution").onchange = () => { drawNetwork(); route(); };
$("showNet").onchange = drawNetwork;
loadSolutions().then(drawNetwork);
</script>
</body>
</html>
